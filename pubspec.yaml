name: pixelmap
description: A Minecraft-style pixelated map with fog of war

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  flutter_compass: ^0.7.0
  supabase_flutter: ^2.0.2
  flutter_riverpod: ^2.4.5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  cached_network_image: ^3.3.0
  image: ^4.1.3
  http: ^1.1.0
  location: ^5.0.3
  permission_handler: ^11.0.1
  uuid: ^4.2.1
  intl: ^0.18.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  dio: ^5.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Minecraft
      fonts:
        - asset: assets/fonts/Minecraft-Regular.ttf
